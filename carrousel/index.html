<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/styles.css">
    <title>Carrousel</title>
</head>

<body>
    <header>
        <h1 style="display: none">Ejercicio</h1>
    </header>
    <main>
        <section>
            <article class="carrousel-container">
                <h2>Carrousel simple con CSS3 puro</h2>
                <p> Galería de imágenes en animación infinita automática tipo Carrousel </p>
                <ul class="carrousel">
                    <li>
                        <figure class="img-before diapositiva-1">
                            <figcaption>Diapositiva 1</figcaption>
                        </figure>
                    </li>
                    <li>
                        <figure class="img-before diapositiva-2">
                            <figcaption>Diapositiva 2</figcaption>
                        </figure>
                    </li>
                    <li>
                        <figure class="img-before diapositiva-3">
                            <figcaption>Diapositiva 3</figcaption>
                        </figure>
                    </li>
                    <li>
                        <figure class="img-before diapositiva-4">
                            <figcaption>Diapositiva 4</figcaption>
                        </figure>
                    </li>
                    <li>
                        <figure class="img-before diapositiva-5">
                            <figcaption>Diapositiva 5</figcaption>
                        </figure>
                    </li>
                </ul>
            </article>
        </section>
    </main>
</body>

</html>
